[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "antlrope"
# Single source of truth: src/antlrope/VERSION (read at build time below).
dynamic = ["version"]
description = "Fast, C++-accelerated ANTLR Python runtime for target-agnostic grammars"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Christopher Barber" }]
keywords = ["antlr", "antlr4", "parser", "parsing", "grammar", "python"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: General",
]

# Generated lexer/parser modules subclass the official pure-Python runtime and do
# `from antlr4 import *`, so it must be importable for the documented facade
# workflow (load_specs / walk). The C++ engine itself never imports it, but the
# advertised API requires it, so it is a hard runtime dependency.
dependencies = ["antlr4-python3-runtime>=4.13"]

[project.urls]
Homepage = "https://github.com/zuzukin/antlrope"
Source = "https://github.com/zuzukin/antlrope"

[project.scripts]
antlrope = "antlrope.generate:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# Rebuild explicitly with `pixi run build`, not on every import. The C++ rarely
# changes, and rebuild-on-import made `import antlrope` shell out to cmake,
# which fails wherever the env is not activated (e.g. PyCharm using the prefix as
# a plain interpreter). With this off, imports never touch the build toolchain.
editable.rebuild = false
editable.verbose = false
# Python package lives under src/; the C++ extension sources are in cpp/.
wheel.packages = ["src/antlrope"]
# Build a single CPython Stable ABI (abi3) wheel per platform. The extension is
# compiled with nanobind's STABLE_ABI (see CMakeLists.txt), which targets the
# limited API from CPython 3.12 on, so one `cp312-abi3` wheel runs on 3.12, 3.13,
# 3.14, and future CPythons without a rebuild. Requires `requires-python >= 3.12`.
wheel.py-api = "cp312"

# Project version is read from the VERSION file in the package (the single source
# of truth). `dynamic = ["version"]` above defers to this provider.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/antlrope/VERSION"
regex = '(?P<value>.+)'

[tool.cibuildwheel]
# One CPython Stable ABI (abi3) build per platform: `wheel.py-api = "cp312"` above
# makes scikit-build-core emit a `cp312-abi3` wheel that works on 3.12+, so we
# only need to build under cp312 (not once per CPython). Skip PyPy and the
# 32-bit / musllinux targets to keep the C++ build matrix sane; the vendored
# runtime needs a C++17 compiler (present on all default cibuildwheel images).
build = "cp312-*"
skip = "*-musllinux* *_i686 *-win32"
build-frontend = "build"
# Smoke-test each built wheel: import the extension and print its version. No
# extra test deps are needed — the wheel pulls antlr4-python3-runtime itself.
test-command = "python -c \"import antlrope as a; print(a.__version__)\""

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.ruff]
# Lint/format the hand-written sources, tests, helper scripts, and examples. The
# stock ANTLR-generated lexer/parser modules are excluded: they are tool output,
# not our code, and follow ANTLR's own (non-PEP8) style.
target-version = "py310"
# Excluded: stock ANTLR-generated parsers, the vendored C++ runtime, build/site
# output, and `*.pyi` (the _native stub is produced by `pixi run stubgen` and
# hand-tweaked — formatting it here would just churn against stubgen output).
extend-exclude = ["examples/*/generated", "vendor", "build", "build-asan", "site", "*.pyi"]

[tool.ruff.lint]
# A pragmatic core: pyflakes/pycodestyle (E, F, W), import sorting (I), pyupgrade
# (UP), bugbear (B), comprehensions (C4), simplify (SIM), and Ruff's own lints
# (RUF). pep8-naming (N) is intentionally omitted — the facade mirrors ANTLR's
# camelCase callback names (enterRule, visitTerminal, ...). Line length is left
# to the formatter (E501 off), so prose comments and literals don't nag.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Package surfaces its public API by re-export from __init__ (no __all__).
"src/antlrope/__init__.py" = ["F401"]

[tool.pyright]
# Type-check the shipped library and the helper scripts. Tests and examples pull
# in the ANTLR-generated modules via runtime sys.path manipulation, which a
# static checker can't resolve, so they're out of scope here.
include = ["src", "scripts"]
exclude = ["**/__pycache__", "examples/*/generated", "vendor", "build", "build-asan", "site"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# _native is a compiled nanobind extension: pyright resolves its hand-maintained
# `_native.pyi` stub but (correctly) notes there's no Python source behind it.
# That's expected for a C++ extension, so silence the per-import warning.
reportMissingModuleSource = "none"

# Coverage (pytest-cov / coverage.py), driven by the `coverage` pixi task. Measure
# only the shipped package under src/ (the editable install imports it from there),
# and keep every artifact in the git-ignored .coverage/ directory: the data file,
# the HTML site, and the JSON report. The task also prints a summary to stdout.
[tool.coverage.run]
source = ["src/antlrope"]
branch = true
data_file = ".coverage/.coverage"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# Native build toolchain + the extension's build backend, from conda-forge. The
# explicit `pixi run build` recompiles via cmake directly (see
# scripts/build_native.py), so the whole rebuild path is reproducible here.
[tool.pixi.dependencies]
python = ">=3.10"
antlr4-python3-runtime = ">=4.13"

[tool.pixi.pypi-dependencies]
# Installs the package from source tree
antlrope = { path = ".", editable = true }

# Build the editable package against the env's own toolchain (not an isolated,
# throwaway one), so the rebuild-on-import hook resolves cmake/ninja correctly.
[tool.pixi.pypi-options]
no-build-isolation = ["antlrope"]

[tool.pixi.activation.env]
MACOSX_DEPLOYMENT_TARGET = "11.0"

[tool.pixi.feature.dev.dependencies]
cxx-compiler = "*"
cmake = ">=3.21"
ninja = "*"
nanobind = ">=2.0"
scikit-build-core = ">=0.10"
# pytest drives the correctness suite. It is a dev tool only — no end user or
# downstream consumer needs an `antlrope[test]` extra (the suite isn't
# shipped in the wheel), so it lives in the dev environment, not as a published
# optional dependency.
pyright = ">=1.1.409"
pytest = ">=7"
pytest-cov = ">=4"
ruff = ">=0.15.16"

# Java + the ANTLR tool, isolated in a dedicated feature so the Python build/test
# environments never pull in a JDK.
[tool.pixi.feature.gen.dependencies]
openjdk = ">=11"

[tool.pixi.feature.gen.pypi-dependencies]
antlr4-tools = "*"

# Documentation toolchain (Zensical, the Material-for-MkDocs-team static site
# generator). Isolated and default-feature-free so it pulls neither the JDK nor
# the C++ build toolchain — building the docs never compiles the extension.
[tool.pixi.feature.docs.dependencies]
python = ">=3.10"

[tool.pixi.feature.docs.pypi-dependencies]
zensical = "*"
# API reference generated from docstrings (Python handler pulls in mkdocstrings +
# griffe). Static analysis only — the docs env never builds the C++ extension.
mkdocstrings-python = "*"
mkdocstrings-python-xref = "*"

# conda-forge recipe builder (rattler-build). Isolated with no default feature:
# rattler-build creates its own sandboxed build/host environment from the recipe,
# so the package's own C++ toolchain feature is not needed here.
[tool.pixi.feature.recipe.dependencies]
rattler-build = "*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
gen = { features = ["gen"], solve-group = "default" }
docs = { features = ["docs"], no-default-feature = true }
recipe = { features = ["recipe"], no-default-feature = true }

[tool.pixi.tasks]
doc-build = [{ task = "docs-build" }]
doc-serve = [{ task = "docs-serve" }]
doc-show = [{ task = "docs-serve" }]

[tool.pixi.tasks.example]
description = "Run the JSON reconstruction example end to end."
cmd = "python to_python.py"
cwd = "examples/json"

[tool.pixi.tasks.example-schema]
description = "Run the schema indexing / parallel-chunking example end to end."
cmd = "python index.py"
cwd = "examples/schema"

[tool.pixi.tasks.lint]
description = "Lint with ruff (report only; run `format` to apply style fixes)."
cmd = "ruff check ."

[tool.pixi.tasks.format]
description = "Format the code with ruff (also sorts imports via `lint --fix`)."
cmd = "ruff format ."

[tool.pixi.tasks.typecheck]
description = "Static type-check the package and scripts with pyright."
cmd = "pyright"

[tool.pixi.tasks.check]
description = "Full local gate: lint, type-check, and run the test suite."
depends-on = ["lint", "typecheck", "test"]

[tool.pixi.tasks.test]
description = "Run the pytest correctness suite."
cmd = "pytest"

[tool.pixi.tasks.coverage]
description = "Run the test suite under coverage; write an HTML site + JSON report into .coverage/ and print a summary to stdout."
cmd = "mkdir -p .coverage && pytest --cov --cov-report=term-missing --cov-report=html:.coverage/html --cov-report=json:.coverage/coverage.json"

[tool.pixi.tasks.build]
description = "Rebuild the _native C++ extension (run after editing cpp/ or the vendored runtime)."
cmd = "python scripts/build_native.py"

[tool.pixi.tasks.stubgen]
description = "Regenerate src/antlrope/_native.pyi from the built extension (runs nanobind stubgen + re-applies the hand edits)."
cmd = "python scripts/stubgen.py"

[tool.pixi.tasks.asan-test]
description = "Build and run the AddressSanitizer C++ harness over the example grammars (macOS + Linux)."
cmd = "python scripts/asan_harness.py"

[tool.pixi.tasks.asan-pytest]
description = "Run the pytest suite under AddressSanitizer (Linux; skipped on macOS). Covers the binding too."
cmd = "python scripts/asan_pytest.py"

[tool.pixi.feature.gen.tasks.gen-json]
description = "Regenerate the example's Python parser/lexer from the grammar (ANTLR tool)."
cmd = "antlr4 -Dlanguage=Python3 JSON.g4 -o generated"
cwd = "examples/json"
env = { ANTLR4_TOOLS_ANTLR_VERSION = "4.13.2" }

[tool.pixi.feature.gen.tasks.gen-facade]
description = "Regenerate the event-listener facade from the generated parser module (run `pixi run format` afterward)."
cmd = "antlrope generated.JSONParser JSON -o json_listener.py"
cwd = "examples/json"
env = { PYTHONPATH = "." }

[tool.pixi.feature.gen.tasks.gen-pred]
description = "Regenerate the predicate-limitation fixture's parser/lexer (tests/test_predicate_limitation.py)."
cmd = "antlr4 -Dlanguage=Python3 Pred.g4 -o generated"
cwd = "examples/predicate"
env = { ANTLR4_TOOLS_ANTLR_VERSION = "4.13.2" }

[tool.pixi.feature.gen.tasks.gen-schema]
description = "Regenerate the schema example's Python parser/lexer from the grammar (ANTLR tool)."
cmd = "antlr4 -Dlanguage=Python3 Schema.g4 -o generated"
cwd = "examples/schema"
env = { ANTLR4_TOOLS_ANTLR_VERSION = "4.13.2" }

[tool.pixi.feature.gen.tasks.gen-schema-facade]
description = "Regenerate the schema example's event-listener facade (run `pixi run format` afterward)."
cmd = "antlrope generated.SchemaParser Schema -o schema_listener.py"
cwd = "examples/schema"
env = { PYTHONPATH = "." }

[tool.pixi.feature.docs.tasks.docs-build]
description = "Build the static documentation site into site/ (configured in zensical.toml)."
cmd = "zensical build"

[tool.pixi.feature.docs.tasks.docs-serve]
description = "Serve the docs locally with live reload at http://localhost:8000."
cmd = "zensical serve"

[tool.pixi.feature.docs.tasks.doc-clean]
description = "Remove generated doc files"
cmd = "rm -rf site"

# TODO - try using whl2conda to build conda package directly from wheel

# TODO - maybe rename conda-recipe to conda-forge-recipe?
[tool.pixi.feature.recipe.tasks.recipe-build]
description = "Build the conda package locally from conda-recipe/recipe.yaml (rattler-build)."
cmd = "rattler-build build --recipe conda-recipe/recipe.yaml"
