[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "antlr-pyfacade"
version = "0.1.0"
description = "Fast, C++-accelerated ANTLR runtime for Python: a bulk filtered event-stream facade over the official ANTLR4 C++ runtime, driven by stock Python3-target output."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Christopher Barber" }]
keywords = ["antlr", "antlr4", "parser", "parsing", "grammar"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: General",
]

# Generated lexer/parser modules subclass the official pure-Python runtime and do
# `from antlr4 import *`, so it must be importable for the documented facade
# workflow (load_specs / walk). The C++ engine itself never imports it, but the
# advertised API requires it, so it is a hard runtime dependency.
dependencies = ["antlr4-python3-runtime>=4.13"]

[project.urls]
Homepage = "https://github.com/analog-cbarber/antlr-pyfacade"
Source = "https://github.com/analog-cbarber/antlr-pyfacade"

[project.scripts]
antlr-pyfacade-gen = "antlr_pyfacade.gen_facade:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
editable.rebuild = true
editable.verbose = false

[tool.cibuildwheel]
# CPython only; skip PyPy and the 32-bit / musllinux targets to keep the C++
# build matrix sane. The vendored runtime needs a C++17 compiler (present on
# all default cibuildwheel images).
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux* *_i686 *-win32"
build-frontend = "build"
# Smoke-test each built wheel: import the extension and print its version. No
# extra test deps are needed — the wheel pulls antlr4-python3-runtime itself.
test-command = "python -c \"import antlr_pyfacade as a; print(a.__version__)\""

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# Native build toolchain + the extension's build backend, from conda-forge so the
# editable `editable.rebuild` hook always finds a persistent cmake/ninja on PATH.
[tool.pixi.dependencies]
python = ">=3.10"
cxx-compiler = "*"
cmake = ">=3.21"
ninja = "*"
nanobind = ">=2.0"
scikit-build-core = ">=0.10"

[tool.pixi.pypi-dependencies]
# Installs the package editable; its declared runtime dependency
# (antlr4-python3-runtime) is resolved automatically from [project.dependencies].
antlr-pyfacade = { path = ".", editable = true }

# Build the editable package against the env's own toolchain (not an isolated,
# throwaway one), so the rebuild-on-import hook resolves cmake/ninja correctly.
[tool.pixi.pypi-options]
no-build-isolation = ["antlr-pyfacade"]

[tool.pixi.activation.env]
MACOSX_DEPLOYMENT_TARGET = "11.0"

# Java + the ANTLR tool, isolated in a dedicated feature so the Python build/test
# environments never pull in a JDK.
[tool.pixi.feature.gen.dependencies]
openjdk = ">=11"

[tool.pixi.feature.gen.pypi-dependencies]
antlr4-tools = "*"

# Documentation toolchain (Zensical, the Material-for-MkDocs-team static site
# generator). Isolated and default-feature-free so it pulls neither the JDK nor
# the C++ build toolchain — building the docs never compiles the extension.
[tool.pixi.feature.docs.dependencies]
python = ">=3.10"

[tool.pixi.feature.docs.pypi-dependencies]
zensical = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
gen = { features = ["gen"], solve-group = "default" }
docs = { features = ["docs"], no-default-feature = true }

[tool.pixi.tasks]
# Run the JSON reconstruction example end to end.
example = { cmd = "python to_python.py", cwd = "examples/json" }

# pytest drives the correctness suite. It is a dev/test tool only — no end user
# or downstream consumer needs an `antlr-pyfacade[test]` extra (the test suite
# isn't shipped in the wheel), so it lives in the pixi test feature rather than as
# a published optional dependency.
[tool.pixi.feature.test.dependencies]
pytest = ">=7"

[tool.pixi.feature.test.tasks]
test = "pytest"

[tool.pixi.feature.gen.tasks]
# Regenerate the example's Python parser/lexer from the grammar (ANTLR tool).
gen-json = { cmd = "antlr4 -Dlanguage=Python3 JSON.g4 -o generated", cwd = "examples/json", env = { ANTLR4_TOOLS_ANTLR_VERSION = "4.13.2" } }
# Regenerate the event-listener facade from the generated parser module.
gen-facade = { cmd = "antlr-pyfacade-gen generated.JSONParser JSON -o json_listener.py", cwd = "examples/json", env = { PYTHONPATH = "." } }
# Regenerate the predicate-limitation fixture's parser/lexer (tests/test_predicate_limitation.py).
gen-pred = { cmd = "antlr4 -Dlanguage=Python3 Pred.g4 -o generated", cwd = "examples/predicate", env = { ANTLR4_TOOLS_ANTLR_VERSION = "4.13.2" } }

[tool.pixi.feature.docs.tasks]
# Build the static documentation site into site/ (configured in zensical.toml).
docs-build = "zensical build"
# Serve the docs locally with live reload at http://localhost:8000.
docs-serve = "zensical serve"
