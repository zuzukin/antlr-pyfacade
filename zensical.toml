# Zensical documentation site configuration.
# Build:   pixi run docs-build   (output in site/)
# Preview: pixi run docs-serve   (http://localhost:8000)
# See https://zensical.org/docs/ for the full reference.

[project]
site_name = "antlr-pyfacade"
site_description = "Fast, C++-accelerated ANTLR runtime for Python: a bulk filtered event-stream facade over the official ANTLR4 C++ runtime, driven by stock Python3-target output."
site_author = "Christopher Barber"
site_url = "https://zuzukin.github.io/antlr-pyfacade/"
repo_url = "https://github.com/zuzukin/antlr-pyfacade"
repo_name = "zuzukin/antlr-pyfacade"
copyright = """
Copyright &copy; 2026 Christopher Barber
"""

nav = [
  { "User Guide" = [
    { "Overview" = "index.md" },
    { "Getting started" = "getting-started.md" },
    { "Chunking" = "chunking.md" },
    { "Parallel parsing" = "parallel-parsing.md" },
    { "Migrating" = "migrating.md" },
    { "How it works" = "concepts.md" },
    { "Performance & limitations" = "performance.md" },
    { "Benchmark: SystemRDL" = "benchmarks/systemrdl.md" },
  ] },
  { "Installation" = "installation.md" },
  { "Reference" = [
    { "API" = "reference/api.md" },
    { "Command line" = "reference/cli.md" },
  ] },
  { "About" = [
    { "Release notes" = "about/changelog.md" },
    { "Motivation" = "about/motivation.md" },
    { "License" = "about/license.md" },
    { "Acknowledgements" = "about/acknowledgements.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/zuzukin/antlr-pyfacade"

[project.plugins.offline]
enabled = false

# API reference generated from the package docstrings (Reference tab). Static
# analysis of src/ (the docs env doesn't build the extension): griffe reads the
# .py sources and the generated _native.pyi stub.
[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = false
show_root_heading = true
show_if_no_docstring = false
members_order = "source"

# Recommended Markdown extension baseline (mirrors the Zensical default template).
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
# Lets the About pages embed the repo-root CHANGELOG.md / LICENSE via `--8<--`.
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
